<title>Monster Snack Shop</title>
<style>
:root{
  --ink:#3A2A4A; --cream:#FFF9F0; --pink:#FF8FB8; --pinkd:#C2448A;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
  --mon: clamp(118px, min(23vh, 16.5vw), 230px);
  --btn: clamp(68px, 9.5vh, 92px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;background:#FFF3F6;font-family:var(--font);color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
textarea,input{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;touch-action:auto}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:none}
svg{overflow:visible}
#scene{position:fixed;inset:0;z-index:0}
#scene svg{width:100%;height:100%;display:block}
#bubbles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;bottom:-80px;border-radius:50%;border:2px solid rgba(255,255,255,.85);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0 12%,rgba(255,220,235,.25) 13%,rgba(200,230,255,.18) 100%);
  animation:floatUp linear infinite;opacity:.55}
@keyframes floatUp{0%{transform:translate(0,0)}50%{transform:translate(18px,-55vh)}100%{transform:translate(-10px,-115vh)}}
#app{position:fixed;inset:0;z-index:1;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- buttons ---------- */
.btn-round{width:var(--btn);height:var(--btn);border-radius:50%;background:#fff;border:4px solid #F6C9D9;
  box-shadow:0 6px 0 #F1B7CB,0 12px 20px rgba(90,40,70,.12);display:grid;place-items:center;transition:transform .1s}
.btn-round:active{transform:translateY(4px);box-shadow:0 2px 0 #F1B7CB}
.btn-round svg{width:62%;height:62%}
.topbar{height:calc(var(--btn) + 26px);display:flex;align-items:center;justify-content:space-between;padding:12px 22px;position:relative;flex:none}
.spacer{width:var(--btn)}

/* ---------- progress ---------- */
.progress{display:flex;gap:clamp(6px,1.2vw,14px);padding:10px 18px;background:rgba(255,255,255,.75);border-radius:40px;box-shadow:0 4px 12px rgba(90,40,70,.08)}
.pdot{width:clamp(22px,3.4vh,32px);height:clamp(22px,3.4vh,32px);border-radius:50%;border:3px dashed #E6C8D6;background:#fff;transition:all .3s}
.pdot.f{border:3px solid #fff;background:radial-gradient(circle at 50% 50%,#fff 0 22%,transparent 23%),conic-gradient(#FF8FB8,#FFD84A,#4FD8B4,#5EC4FF,#B48CFF,#FF8FB8);
  box-shadow:0 0 0 2px #F6C9D9;animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}

/* ---------- counter & monsters ---------- */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.counter{position:relative;flex:none;display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,2.2vw,34px);padding:0 2vw 10px;
  height:calc(var(--mon) * 1.16 + 64px)}
.counter::before{content:'';position:absolute;left:0;right:0;bottom:0;height:54px;
  background:repeating-linear-gradient(90deg,#FFE0CC 0 46px,#FFD6BE 46px 92px);border-top:9px solid #FFF1E6;
  box-shadow:0 -3px 0 #F7C9AE,inset 0 6px 0 rgba(255,255,255,.5)}
.slot{position:relative;width:var(--mon);display:flex;flex-direction:column;align-items:center;z-index:1}
.slot.top{z-index:30}
.mon{width:100%;position:relative;touch-action:none;transform-origin:50% 60%}
.mon.dragging{z-index:50;filter:drop-shadow(0 18px 14px rgba(90,40,70,.18))}
.fwd{transition:transform .35s cubic-bezier(.34,1.56,.64,1);transform-origin:50% 95%}
.react{transform-origin:50% 95%}
.msvg{width:100%;aspect-ratio:200/232;display:block}
.sign{margin-top:-8px;min-width:60px;height:46px;padding:0 14px;border-radius:16px;background:#fff;font-size:38px;font-weight:800;
  display:grid;place-items:center;border:4px solid var(--vd);color:var(--vd);position:relative;z-index:2;line-height:1;
  box-shadow:0 4px 0 var(--vd)}
.mon.eager .fwd{transform:scale(1.08) rotate(-3deg)}
.slot.coach .fwd{animation:coach 1.1s ease-in-out infinite}
@keyframes coach{0%,100%{transform:translateY(-10%) scale(1.14)}50%{transform:translateY(-14%) scale(1.17)}}
.slot.dim .mon{opacity:.38;filter:saturate(.5)}
.slot.asleep .mon{opacity:.4;filter:grayscale(.6)}
.zzz{position:absolute;top:2%;right:4%;font-size:30px;font-weight:800;color:#8A7AA8;display:none;animation:zz 2s ease-in-out infinite}
.slot.asleep .zzz{display:block}
@keyframes zz{50%{transform:translate(6px,-10px);opacity:.5}}
.slot.selected .mon .fwd{transform:translateY(-8%) scale(1.06)}
.slot.selected .sign{background:#FFF6B8}
.kw{position:absolute;top:-6%;right:-30%;width:clamp(64px,9vh,88px);height:clamp(64px,9vh,88px);border-radius:50%;background:#fff;
  border:4px solid var(--vd);display:none;place-items:center;font-size:clamp(38px,5.6vh,54px);z-index:5;box-shadow:0 6px 14px rgba(90,40,70,.15)}
.slot.coach .kw{display:grid;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
.mirror-btn{position:absolute;top:-6%;left:-30%;display:none;z-index:5}
.slot.coach.cam .mirror-btn{display:grid;animation:popIn .4s .2s both cubic-bezier(.34,1.56,.64,1)}
.mirror-btn{font-size:clamp(34px,5vh,48px)}
.qbub{position:absolute;top:-4%;left:58%;width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid #D8C6E6;font-size:36px;
  font-weight:800;color:#8A6AA8;display:none;place-items:center;z-index:6}
.slot.puzzled .qbub{display:grid;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}

/* svg monster parts */
.m-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.03)}}
.eye{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s}
.blink .eye{transform:scaleY(.08)}
.pupil{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .18s}
.m-mouth{transform-box:fill-box;transform-origin:50% 40%;transition:transform .25s}
.wide .m-mouth,.mon.eager .m-mouth,.slot.coach .m-mouth{transform:scale(1.45)}
.eyes-h{display:none}
.happy .eyes-h{display:inline}.happy .eyes-n{display:none}
.m-dot{transform-box:fill-box;transform-origin:50% 50%;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
.m-ant{transform-box:fill-box;transform-origin:30% 100%;animation:spring 1.9s ease-in-out infinite}
@keyframes spring{50%{transform:rotate(7deg)}}
.m-bow{transform-box:fill-box;transform-origin:50% 50%;animation:flutter 2.6s ease-in-out infinite}
@keyframes flutter{50%{transform:rotate(-7deg) scale(1.04)}}
.m-tuft{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.8s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-8deg)}}
.giggle-lines{display:none}
.giggling .giggle-lines{display:inline}

/* reactions */
.r-hop{animation:hop .6s ease-out}
@keyframes hop{0%{transform:none}20%{transform:scale(1.1,.88)}50%{transform:translateY(-22%) scale(.94,1.07)}80%{transform:scale(1.06,.94)}100%{transform:none}}
.r-munch{animation:munch .85s ease-in-out}
@keyframes munch{0%,100%{transform:none}15%,48%,81%{transform:scale(1.08,.9)}32%,65%{transform:scale(.96,1.05)}}
.r-munch .m-mouth{animation:chomp .28s 3}
@keyframes chomp{50%{transform:scale(1.2,.25)}}
.r-tilt{animation:tilt 1.5s ease-in-out}
@keyframes tilt{0%{transform:none}25%,70%{transform:rotate(-13deg) translateX(-4%)}100%{transform:none}}
.r-giggle{animation:giggle .9s linear}
@keyframes giggle{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:rotate(-6deg) translateY(-3%)}20%,40%,60%,80%{transform:rotate(6deg)}}
.r-wiggle{animation:wiggle .8s ease-in-out}
@keyframes wiggle{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.r-curl{animation:curl .5s ease-in forwards}
@keyframes curl{40%{transform:scale(1.18,.78) rotate(-10deg)}100%{transform:scale(.7,.7) rotate(-25deg)}}
.r-wave{animation:hop .6s ease-out 3}

/* ---------- words ---------- */
.word{font-size:clamp(84px,14vh,150px);font-weight:800;line-height:1;display:flex;align-items:center;color:var(--ink);letter-spacing:.02em}
.word .L{display:inline-block;min-width:.58em;text-align:center;position:relative;transition:color .2s}
.word .L.vs::after{content:'';position:absolute;left:14%;right:14%;bottom:-.1em;height:.07em;border-radius:9px;background:#E3D2EE}
.word .L.glow,.gap.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 .1em #FFD84A,0 0 .3em #FFE98A;transform:scale(1.14);background-color:rgba(255,232,120,.35);border-radius:.15em}}
.gap{display:inline-block;width:.6em;height:.82em;margin:0 .04em;border:7px dashed #CDB7DA;border-radius:.16em;background:rgba(255,255,255,.6)}
.gap.eager{border-color:#FF8FB8;background:#FFF0F6;transform:scale(1.08)}
.gap.filled{border:0;background:none;width:auto;height:auto}

.reveal{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.reveal .card{font-size:clamp(110px,22vh,200px);line-height:1;background:#fff;border-radius:40px;padding:3vh 4vh;box-shadow:0 10px 30px rgba(90,40,70,.18);
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
.reveal .card svg,.bigpic svg{width:1.1em;height:1.1em;display:block}

/* picture mode */
.pic-wrap{display:flex;align-items:center;gap:5vw}
.bigpic{font-size:clamp(110px,22vh,210px);line-height:1;background:#fff;border-radius:44px;padding:3.2vh 3.6vh;box-shadow:0 10px 0 #F3D6E2,0 18px 30px rgba(90,40,70,.12);
  display:grid;place-items:center;min-width:1.4em;min-height:1.4em}
.bigpic.cheer{animation:wiggle .6s ease-in-out 2}
.word-card{background:rgba(255,255,255,.85);border-radius:36px;padding:2.4vh 3.4vh 3.4vh;box-shadow:0 8px 20px rgba(90,40,70,.08)}

/* morph mode */
.morph-wrap{display:flex;align-items:center;gap:4vw}
.caul{position:relative;width:clamp(300px,44vh,420px);aspect-ratio:300/250;touch-action:none}
.caul svg{position:absolute;inset:0;width:100%;height:100%}
.caul .cw{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:#fff;border-radius:30px;padding:1.2vh 3vh 4.5vh;
  box-shadow:0 6px 18px rgba(90,40,70,.15)}
.caul .cw .word{font-size:clamp(70px,11vh,120px)}
.caul.eager .cw{box-shadow:0 0 0 8px #FFF3A8,0 6px 18px rgba(90,40,70,.15)}
.caul .front{pointer-events:none}
.cbub{position:absolute;bottom:58%;border-radius:50%;background:rgba(190,255,225,.8);border:2px solid #fff;animation:cb 2.4s ease-in infinite}
@keyframes cb{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1);opacity:0}}
.judge-box{display:flex;flex-direction:column;gap:3vh;opacity:0;pointer-events:none;transform:scale(.6);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.judge-box.on{opacity:1;pointer-events:auto;transform:none}
.judge{width:clamp(96px,15vh,140px);height:clamp(96px,15vh,140px);border-radius:50%;background:#fff;font-size:clamp(56px,8.5vh,80px);
  box-shadow:0 8px 0 #E9D3F0,0 14px 24px rgba(90,40,70,.12);display:grid;place-items:center;border:5px solid #F0E2F6}
.judge:active{transform:translateY(5px);box-shadow:0 3px 0 #E9D3F0}
.judge.hintglow{animation:jg 1s ease-in-out infinite}
@keyframes jg{50%{transform:scale(1.12);box-shadow:0 0 0 12px #FFF3A8,0 8px 0 #E9D3F0}}
.chain{display:flex;gap:10px;justify-content:center;margin-bottom:1.4vh}
.chain i{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #E3D2EE}
.chain i.f{background:#B48CFF;border-color:#fff;box-shadow:0 0 0 2px #E3D2EE}
.morph-pic{position:absolute;right:-18%;top:-10%;font-size:clamp(70px,11vh,110px);background:#fff;border-radius:28px;padding:10px;box-shadow:0 8px 20px rgba(90,40,70,.18);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);line-height:1}
.morph-pic svg{width:1.1em;height:1.1em;display:block}

/* ---------- home ---------- */
.home-sign{display:inline-block;margin:calc(var(--btn) * .35 + 2vh) auto 0;background:#fff;border-radius:30px;padding:1.4vh 4vh;font-size:clamp(34px,5.6vh,58px);font-weight:900;
  box-shadow:0 8px 0 #F6C9D9,0 14px 30px rgba(90,40,70,.12);letter-spacing:.01em;border:5px solid #FFE0EA;position:relative}
.home-sign span{display:inline-block;animation:signb 3s ease-in-out infinite}
@keyframes signb{50%{transform:translateY(-4px)}}
.home-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:6vw;min-height:0}
.play-btn{width:clamp(130px,21vh,190px);height:clamp(130px,21vh,190px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFB3CC,#FF7BA6 60%,#F25C8E);box-shadow:0 12px 0 #C9447A,0 22px 34px rgba(200,60,120,.3);
  display:grid;place-items:center;animation:pulse 2s ease-in-out infinite;border:6px solid #fff}
.play-btn:active{transform:translateY(8px)!important;box-shadow:0 4px 0 #C9447A}
.play-btn svg{width:46%;height:46%;margin-left:8%}
@keyframes pulse{50%{transform:scale(1.06)}}
.big-btn{width:clamp(96px,15vh,130px);height:clamp(96px,15vh,130px);border-radius:34px;background:#fff;box-shadow:0 8px 0 #E7CFE0,0 14px 24px rgba(90,40,70,.12);
  display:grid;place-items:center;position:relative;border:5px solid #F5E6F0}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #E7CFE0}
.big-btn svg{width:70%;height:70%}
.badge{position:absolute;top:-12px;right:-12px;min-width:40px;height:40px;border-radius:20px;background:#FF7BA6;color:#fff;font-weight:900;font-size:24px;
  display:grid;place-items:center;border:4px solid #fff;padding:0 6px}
.gear{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 14px);width:64px;height:64px;border-radius:50%;
  display:grid;place-items:center;opacity:.55;z-index:5}
.gear svg.g{width:34px;height:34px}
.gear svg.ring{position:absolute;inset:0;width:64px;height:64px;transform:rotate(-90deg)}
.gear .ring circle{fill:none;stroke:#FF7BA6;stroke-width:5;stroke-dasharray:176;stroke-dashoffset:176;stroke-linecap:round}
.gear.pressing{opacity:1}
.gear.pressing .ring circle{animation:ringfill 3s linear forwards}
@keyframes ringfill{to{stroke-dashoffset:0}}

/* ---------- book & dress ---------- */
.book-page{flex:1;display:flex;align-items:center;justify-content:center;gap:2vw;min-height:0;padding-bottom:3vh}
.page{background:#FFFDF8;border-radius:30px;box-shadow:0 10px 0 #EBD9C9,0 20px 40px rgba(90,40,70,.12);padding:3vh;display:grid;
  grid-template-columns:repeat(6,1fr);gap:2vh;width:min(76vw,120vh);background-image:radial-gradient(#F3E6DA 1.5px,transparent 1.5px);background-size:22px 22px}
.sticker-slot{aspect-ratio:1;border-radius:50%;border:4px dashed #EADBCF;display:grid;place-items:center}
.sticker{width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #fff,0 6px 12px rgba(90,40,70,.18);display:grid;place-items:center;
  transform:rotate(var(--rot,0deg));font-size:min(7vh,58px);overflow:hidden}
.sticker .msvg{width:82%}
.sticker.new{animation:popIn .6s cubic-bezier(.34,1.56,.64,1)}
.gift-meter{display:flex;align-items:center;gap:12px;background:#fff;border-radius:30px;padding:8px 16px;box-shadow:0 4px 12px rgba(90,40,70,.08)}
.gift-meter i{width:26px;height:26px;border-radius:50%;border:3px dashed #E3C9D6}
.gift-meter i.f{background:#FFD84A;border:3px solid #fff;box-shadow:0 0 0 2px #F3D27A}
.gift-meter svg{width:42px;height:42px}
.tray{display:flex;gap:1.6vw;justify-content:center;padding:1vh 2vw;flex-wrap:wrap}
.acc{width:clamp(80px,12vh,110px);height:clamp(80px,12vh,110px);border-radius:28px;background:#fff;box-shadow:0 6px 0 #EAD6E4,0 12px 20px rgba(90,40,70,.1);
  display:grid;place-items:center;touch-action:none;position:relative}
.acc svg{width:80%;height:80%}
.acc.locked{background:#F4EEF4;box-shadow:0 6px 0 #E6DCE6}
.acc.selected{box-shadow:0 0 0 8px #FFF3A8,0 6px 0 #EAD6E4}
.acc.dragging{z-index:60}
.dress-stage{flex:1;min-height:0}
#dress .counter{--mon:clamp(110px,min(32vh,14vw),260px)}
.caul{width:clamp(320px,50vh,470px)!important}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(255,243,248,.94)}
#overlay.on{display:flex}
.rw{display:flex;flex-direction:column;align-items:center;gap:3vh}
.rw .big-sticker{width:clamp(200px,34vh,300px);height:clamp(200px,34vh,300px);font-size:clamp(120px,20vh,180px);animation:stickerIn .8s cubic-bezier(.34,1.56,.64,1)}
@keyframes stickerIn{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(var(--rot,0deg))}}
.rw .row{display:flex;gap:4vw}
.gift{width:clamp(180px,30vh,260px);height:clamp(180px,30vh,260px);display:grid;place-items:center;position:relative}
.gift .box{animation:giftShake .8s ease-in-out}
@keyframes giftShake{20%,60%{transform:rotate(-8deg)}40%,80%{transform:rotate(8deg)}}
.gift .acc-big{position:absolute;inset:0;display:grid;place-items:center;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
.newfriend{display:flex;align-items:flex-end;gap:3vw}
.newfriend .slot{--mon:clamp(200px,40vh,320px)}
.panel{background:#fff;border-radius:28px;box-shadow:0 20px 50px rgba(90,40,70,.2);width:min(92vw,900px);max-height:88vh;overflow:auto;padding:28px 34px;
  user-select:text;-webkit-user-select:text;touch-action:pan-y;font-size:19px;line-height:1.4}
.panel h2{margin:0 0 6px;font-size:28px}.panel h3{margin:22px 0 8px;font-size:21px;color:#8A4A78}
.panel .muted{color:#7A6A86;font-size:16px}
.panel .opts{display:flex;flex-wrap:wrap;gap:10px}
.panel .opt{min-height:56px;min-width:56px;padding:8px 16px;border-radius:16px;border:3px solid #EAD9F0;background:#FBF7FD;font-size:18px;font-weight:700}
.panel .opt.on{background:#B48CFF;border-color:#9B6EF5;color:#fff}
.panel .opt.danger{border-color:#F4B6C6;background:#FFF2F5;color:#B8325A}
.panel .opt.danger.armed{background:#E6456F;color:#fff}
.panel table{border-collapse:collapse;width:100%;font-size:17px}
.panel td,.panel th{padding:6px 8px;border-bottom:1px solid #F1E8F4;text-align:left}
.bar{height:16px;border-radius:8px;background:#F1E8F4;overflow:hidden;min-width:120px}
.bar b{display:block;height:100%;border-radius:8px}
.panel .head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:-28px;background:#fff;padding:8px 0;z-index:2}
.gate{background:#fff;border-radius:28px;padding:30px 40px;box-shadow:0 20px 50px rgba(90,40,70,.2);text-align:center;font-size:22px}
.gate .opts{display:flex;gap:16px;justify-content:center;margin-top:18px}
.gate .opt{width:90px;height:76px;border-radius:18px;background:#F5EEFA;border:3px solid #E3D2EE;font-size:32px;font-weight:800}
.gate .x{margin-top:18px;font-size:18px;color:#7A6A86;min-height:56px;padding:0 20px}

/* ---------- fx ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:200}
.sp{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;animation:spf .85s cubic-bezier(.2,.8,.3,1) forwards}
.sp.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.sp.dot{border-radius:50%}
.sp.conf{width:10px;height:16px;border-radius:3px}
@keyframes spf{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rr));opacity:0}}
@keyframes popIn{0%{transform:scale(0)}100%{transform:scale(1)}}
#mirror{position:fixed;z-index:150;width:clamp(170px,26vh,240px);height:clamp(170px,26vh,240px);border-radius:50%;overflow:hidden;border:7px solid #fff;
  box-shadow:0 0 0 5px #FFB3CC,0 14px 30px rgba(90,40,70,.25);display:none;background:#FBEFF5}
#mirror.on{display:block;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
#mirror video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}

/* ---------- portrait ---------- */
#portrait{position:fixed;inset:0;z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:#FFF3F6}
#portrait .pm{width:40vw;max-width:280px;transform:rotate(-20deg);animation:tip 2.4s ease-in-out infinite}
#portrait .pi{width:26vw;max-width:170px;animation:rot 2.4s ease-in-out infinite}
@keyframes tip{50%{transform:rotate(-80deg)}}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#portrait{display:flex}}

/* ---------- hub (splash: pick a game tile) ---------- */
.hub-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5vh;min-height:0;padding:1vh 3vw}
.hub-tiles{display:flex;gap:4vw;align-items:stretch;justify-content:center;flex-wrap:wrap}
.tile{width:clamp(230px,31vw,380px);border-radius:42px;border:6px solid #fff;padding:2.6vh 1.6vw 2.4vh;display:flex;flex-direction:column;align-items:center;gap:1.6vh;position:relative;
  box-shadow:0 10px 0 var(--tsh),0 22px 36px rgba(90,40,70,.14);transition:transform .12s}
.tile:active{transform:translateY(7px);box-shadow:0 3px 0 var(--tsh)}
.tile.short{background:linear-gradient(170deg,#FFFFFF,#FFEFF5);--tsh:#F1BCD0}
.tile.aiay{background:linear-gradient(170deg,#FFFFFF,#FFF0DE);--tsh:#F3C9A0}
.tile .art{height:clamp(120px,24vh,210px);width:100%;display:flex;align-items:flex-end;justify-content:center}
.tile.short .art .msvg{width:27%;margin:0 -4.5%}
.tile.aiay .art .mon{width:min(62%,22vh)}
.tile .lbl{font-size:clamp(40px,7.4vh,68px);font-weight:900;line-height:1;letter-spacing:.04em;display:flex;gap:.28em}
.tile .go{position:absolute;right:-16px;bottom:-16px;width:clamp(60px,9vh,78px);height:clamp(60px,9vh,78px);border-radius:50%;border:5px solid #fff;
  background:radial-gradient(circle at 35% 30%,#FFB3CC,#FF7BA6 60%,#F25C8E);box-shadow:0 6px 0 #C9447A;display:grid;place-items:center}
.tile .go svg{width:46%;height:46%;margin-left:8%}
.tile .resume{position:absolute;left:18px;top:16px;display:flex;gap:4px}
.tile .resume i{width:10px;height:10px;border-radius:50%;background:#F3DCE6}
.tile .resume i.f{background:#FF8FB8}
.hub-row{display:flex;gap:5vw;justify-content:center}
@media (hover:hover) and (pointer:fine){ .tile{cursor:pointer} .tile:hover{transform:translateY(-3px)} }

/* ---------- ai / ay word builder ---------- */
.ai-wrap{display:flex;align-items:center;justify-content:center;gap:4.5vw;width:100%;height:100%;position:relative}
.ai-left{display:flex;flex-direction:column;align-items:center;gap:1.4vh}
.ai-left .mon{width:clamp(110px,18vh,170px)}
.ai-talk{display:flex;align-items:center;gap:1.4vw}
.ai-pic{font-size:clamp(96px,17vh,160px);line-height:1;background:#fff;border-radius:36px;padding:2.2vh 3vh;box-shadow:0 10px 0 #F3DCC6,0 18px 30px rgba(90,40,70,.12);animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
.speak{width:clamp(96px,14vh,124px);height:clamp(96px,14vh,124px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD6A8,#FFB36B 60%,#F7963F);
  border:6px solid #fff;box-shadow:0 8px 0 #CF6A1C,0 14px 24px rgba(200,110,40,.3);display:grid;place-items:center}
.speak:active{transform:translateY(6px);box-shadow:0 2px 0 #CF6A1C}
.speak svg{width:58%;height:58%}
.speak.talking{animation:pulse .6s ease-in-out infinite}
.ai-build{display:flex;gap:clamp(10px,1.6vw,22px);align-items:flex-start}
.ai-col{display:flex;flex-direction:column;align-items:center;gap:1.3vh}
.ai-slot{min-width:clamp(96px,15vh,140px);height:clamp(96px,15vh,140px);padding:0 14px;border-radius:24px;border:7px dashed #DCC6E8;background:rgba(255,255,255,.7);
  display:grid;place-items:center;font-size:clamp(56px,10vh,96px);font-weight:900;line-height:1;margin-bottom:1.4vh;transition:transform .2s}
.ai-slot.eager{border-color:#FF8FB8;background:#FFF0F6;transform:scale(1.06)}
.ai-slot.filled{border-style:solid;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.06)}
.ai-slot.glow{animation:slotglow 1.2s ease-in-out infinite}
@keyframes slotglow{50%{box-shadow:0 0 0 10px rgba(255,226,110,.75)}}
.ai-slot.c0.filled{border-color:#B48CFF;color:#5B36B8}
.ai-slot.c1.filled{border-color:#FFB36B;color:#B4560F}
.ai-slot.c2.filled{border-color:#4FD8B4;color:#16806A}
.ptile{min-width:clamp(80px,11vh,112px);height:clamp(64px,9.4vh,88px);padding:0 14px;border-radius:20px;background:#fff;font-size:clamp(42px,7vh,66px);font-weight:900;line-height:1;
  display:grid;place-items:center;border:4px solid var(--pc);color:var(--pt);box-shadow:0 6px 0 var(--pc);touch-action:none;position:relative}
.ptile.c0{--pc:#D9C6FF;--pt:#5B36B8}
.ptile.c1{--pc:#FFD2A6;--pt:#B4560F}
.ptile.c2{--pc:#B7EEDD;--pt:#16806A}
.ptile.dragging{z-index:60}
.ptile.used{visibility:hidden}
.ptile.selected{box-shadow:0 0 0 8px #FFF3A8,0 6px 0 var(--pc)}
.ptile.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.stopsign{font-size:.78em}
.ai-reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3vw;pointer-events:none}
.ai-reveal .card{background:#fff;border-radius:40px;padding:2.6vh 4vh;box-shadow:0 10px 30px rgba(90,40,70,.18);animation:popIn .45s cubic-bezier(.34,1.56,.64,1);line-height:1}
.ai-reveal .wcard{font-size:clamp(90px,16vh,160px);font-weight:900;color:var(--ink)}
.ai-reveal .wcard b{color:#E0791F}
.ai-reveal .pcard{font-size:clamp(100px,18vh,170px)}
.ai-hint{font-size:clamp(30px,5vh,44px);color:#B9A8C8;font-weight:800;letter-spacing:.08em}
@media (hover:hover) and (pointer:fine){ .ptile{cursor:grab} .speak{cursor:pointer} }

/* ---------- computer (mouse + keyboard) ---------- */
.keyhint{display:none;position:absolute;bottom:-8px;right:-8px;min-width:32px;height:32px;padding:0 6px;border-radius:10px;background:#3A2A4A;color:#fff;
  font-size:17px;font-weight:800;place-items:center;font-family:var(--font);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.judge{position:relative}
@media (hover:hover) and (pointer:fine){
  #lineup .mon,.acc:not(.locked),#dress-counter .mon,#home-counter .mon{cursor:grab}
  .mon.dragging,.acc.dragging{cursor:grabbing}
  .btn-round:hover,.big-btn:hover,.judge:hover{filter:brightness(1.05);transform:translateY(-2px)}
  .play-btn:hover{filter:brightness(1.07)}
  #gap,.caul,.gear{cursor:pointer}
  .keyhint{display:grid}
}
#testpanel{position:fixed;right:12px;top:110px;z-index:400;background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 10px 30px rgba(60,30,70,.22);
  padding:10px 12px;width:290px;font-size:13px;display:none;user-select:text;-webkit-user-select:text;touch-action:pan-y;max-height:max(220px, calc(100vh - var(--mon) * 1.16 - 190px));overflow:auto;border:2px solid #E3D2EE}
#testpanel.on{display:block}
#testpanel.min .body{display:none}
#testpanel .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;gap:6px}

const REACTS = ['r-hop','r-munch','r-tilt','r-giggle','r-wiggle','r-curl','r-wave'];
function makeMonster(v, opts={}){
  const mon = document.createElement('div');

  mon.innerHTML = `<div class="fwd"><div class="react">${monsterSVG(v,opts)}</div></div>`;
  const svg = $('svg',mon);
  (function blinkLoop(){ setTimeout(()=>{ if(!mon.isConnected && mon._born) return; mon._born=true;
      svg.classList.add('blink'); setTimeout(()=>svg.classList.remove('blink'),130);
      if(Math.random()<.25) setTimeout(()=>{ svg.classList.add('blink'); setTimeout(()=>svg.classList.remove('blink'),120); },280);

      const r=$('.react',mon); if(!reduceMotion() && !REACTS.some(c=>r.classList.contains(c)) && !mon.classList.contains('dragging')) react(mon,'r-wiggle',800);

/* =====================================================================
   SOUND EFFECTS (synthesized; never speech)
   ===================================================================== */
const SND = {
  ctx:null,
  init(){ try{ if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; this.ctx=new AC(); }
      if(this.ctx.state==='suspended') this.ctx.resume();
      if(!this._unlocked){ const b=this.ctx.createBuffer(1,1,22050), s=this.ctx.createBufferSource(); s.buffer=b; s.connect(this.ctx.destination); s.start(0); this._unlocked=true; } }catch(e){} },
  ok(){ return S && S.settings.sound && this.ctx && this.ctx.state==='running'; },
  tone(f0,f1,dur,{type='sine',vol=.18,delay=0}={}){
    if(!this.ok()) return; const c=this.ctx, t=c.currentTime+delay+.01;
    const o=c.createOscillator(), g=c.createGain(); o.type=type;
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
  },
  noise(dur,{freq=800,q=1,vol=.25,delay=0}={}){
    if(!this.ok()) return; const c=this.ctx, t=c.currentTime+delay+.01;
    if(!this._nb){ const n=c.sampleRate*.6, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; this._nb=b; }
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=this._nb; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+dur+.03);
  },
  pop(v=1){ this.tone(480,950,.09,{vol:.16*v}); },
  munch(){ for(let k=0;k<3;k++){ this.noise(.09,{freq:700+k*90,q:1.6,vol:.4,delay:k*.27}); this.tone(200,90,.09,{type:'triangle',vol:.16,delay:k*.27}); } },
  boing(){ this.tone(200,700,.16,{vol:.18}); this.tone(700,350,.22,{vol:.1,delay:.14}); },
  sparkle(){ [1046,1318,1568,2093].forEach((f,k)=>this.tone(f,f*1.02,.2,{type:'triangle',vol:.08,delay:k*.07})); },
  giggle(){ [0,1,2,3,4,5].forEach(k=>this.tone(880+(k%2)*260,1150+(k%2)*220,.07,{type:'triangle',vol:.11,delay:k*.09})); },
  hmm(){ this.tone(330,392,.2,{vol:.11}); this.tone(392,350,.24,{vol:.09,delay:.2}); },
  splash(){ this.noise(.3,{freq:450,q:.8,vol:.3}); [0,1,2].forEach(k=>this.tone(600+k*200,1200+k*200,.06,{vol:.08,delay:.1+k*.08})); },
  tada(){ [523,659,784,1046].forEach((f,k)=>this.tone(f,f,.28,{type:'triangle',vol:.12,delay:k*.11})); this.sparkle(); },
};

/* =====================================================================
   SPEECH  —  used ONLY by the ai / ay game to say whole words.
   (The short-vowel game never speaks.)
   ===================================================================== */
const SPEAK = {
  voice:null,
  ok(){ return 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance!=='undefined'; },
  // iPad "fun" voices that are hard to understand: never auto-picked or listed.
  NOVELTY:/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Fred|Junior|Ralph|Kathy/i,
  english(){
    if(!this.ok()) return [];
    return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang) && !this.NOVELTY.test(v.name));
  },
  pick(){
    if(!this.ok()) return;
    const en=this.english(); if(!en.length) return;
    const chosen=S.settings.voice && en.find(v=>v.name===S.settings.voice);
    if(chosen){ this.voice=chosen; return; }
    const us=en.filter(v=>/^en[-_]US/i.test(v.lang));
    const hq=v=>/premium|enhanced|neural|natural/i.test(v.name);
    const pref=['Ava','Allison','Zoe','Susan','Samantha','Nicky','Evan','Google US English','Microsoft Aria','Microsoft Jenny'];
    this.voice = us.find(hq) || pref.map(n=>us.find(v=>v.name.includes(n))).find(Boolean) || us.find(v=>v.localService) || us[0] || en[0] || null;
  },
  say(text,{onstart,onend}={}){
    if(!this.ok()) return false;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='en-US'; u.rate=S.settings.speechRate||.65; u.pitch=1;
      if(!this.voice || (S.settings.voice && this.voice.name!==S.settings.voice)) this.pick(); if(this.voice){ u.voice=this.voice; u.lang=this.voice.lang; }
      if(onstart) u.onstart=onstart;
      if(onend){ u.onend=onend; u.onerror=onend; }
      speechSynthesis.speak(u); return true;
    }catch(e){ return false; }
  },
};

function burst(x,y,color,n=16){
  const fx=$('#fx'); n = reduceMotion()? Math.min(5,n) : n;
  const cols=[color,'#FFE066','#fff','#FF8FC7','#7FD3FF'];
  for(let k=0;k<n;k++){
    const d=document.createElement('div'); const kind=pick(['star','star','dot','conf']);
    d.className='sp '+kind; const a=Math.random()*Math.PI*2, dist=rand(60,reduceMotion()?80:160);
    d.style.left=x+'px'; d.style.top=y+'px'; d.style.background=pick(cols);
    d.style.setProperty('--dx',f1(Math.cos(a)*dist)+'px'); d.style.setProperty('--dy',f1(Math.sin(a)*dist-30)+'px'); d.style.setProperty('--rr',Math.round(rand(-300,300))+'deg');
    if(kind==='star'){ const s=rand(14,26); d.style.width=d.style.height=s+'px'; }
    fx.appendChild(d); setTimeout(()=>d.remove(),900);
  }
}
function centerOf(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }

/* =====================================================================
   DRAG & DROP  (Pointer Events + tap)
   ===================================================================== */
function hitTest(targets,x,y,self){
  let best=null, bd=1e9;
  for(const t of targets){ if(!t || t===self || t.contains(self)) continue;
    const r=t.getBoundingClientRect(); const px=r.width*.25, py=r.height*.25;
    if(x>=r.left-px && x<=r.right+px && y>=r.top-py && y<=r.bottom+py){ const d=Math.hypot(x-(r.left+r.width/2), y-(r.top+r.height/2)); if(d<bd){bd=d; best=t;} }
  }
  return best;
}
function dragify(el, o){
  el.addEventListener('pointerdown', e=>{
    if(e.button>0 || el._active) return;
    if(o.canStart && !o.canStart()) { o.onBlocked && o.onBlocked(); return; }
    e.preventDefault(); e.stopPropagation(); SND.init();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    el._active=true; el._dx=el._dy=0; el.style.transition='none';
    const sx=e.clientX, sy=e.clientY, slot=el.closest('.slot'); let moved=false, over=null;
    const mv=ev=>{ if(ev.pointerId!==e.pointerId) return; const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved && Math.hypot(dx,dy)>10){ moved=true; el.classList.add('dragging'); slot&&slot.classList.add('top'); o.onStart&&o.onStart(); SND.pop(.5); }
      if(moved){ el._dx=dx; el._dy=dy; el.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;
        const t=hitTest(o.targets(),ev.clientX,ev.clientY,el); if(t!==over){ over&&over.classList.remove('eager'); over=t; over&&over.classList.add('eager'); }
        lookAt(ev.clientX,ev.clientY); } };
    const up=ev=>{ if(ev.pointerId!==e.pointerId) return;
      el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
      el._active=false; el.classList.remove('dragging'); over&&over.classList.remove('eager'); lookReset();
      if(!moved){ el.style.transform=''; slot&&slot.classList.remove('top'); o.onTap&&o.onTap(); return; }
      if(over && ev.type==='pointerup') o.onDrop(over); else settle(el); };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  });
}
function settle(el){
  el.style.transition='transform .42s cubic-bezier(.34,1.56,.64,1), opacity .2s'; el.style.transform=''; el.style.opacity='';
  el._dx=el._dy=0; const slot=el.closest('.slot');
  setTimeout(()=>{ el.style.transition=''; slot&&slot.classList.remove('top'); },440);
}
function flyTo(el,x,y,sc,ms=380){
  const r=el.getBoundingClientRect(); const cx=r.left+r.width/2-(el._dx||0), cy=r.top+r.height/2-(el._dy||0);
  el.style.transition=`transform ${ms}ms cubic-bezier(.5,0,.6,1), opacity ${ms}ms`;
  el.style.transform=`translate(${f1(x-cx)}px,${f1(y-cy)}px) scale(${sc})`;
  return wait(ms);
}
function resetEl(el){ el.style.transition='none'; el.style.transform=''; el.style.opacity=''; el._dx=el._dy=0; const s=el.closest('.slot'); s&&s.classList.remove('top'); }
function onTap(el, fn){ el.addEventListener('pointerup', e=>{ SND.init(); fn(e); }); }

  for(let x=0;x<1366;x+=84) s+=`<rect x="${x}" y="0" width="42" height="1024" fill="#FFEBF2"/>`;
  const shelf=(x0)=>{ let g='';
    [330,520].forEach((y,row)=>{ g+=`<rect x="${x0}" y="${y}" width="300" height="16" rx="8" fill="#F6D9C8"/><rect x="${x0+20}" y="${y+16}" width="12" height="20" fill="#F1CDB8"/><rect x="${x0+268}" y="${y+16}" width="12" height="20" fill="#F1CDB8"/>`;
      const cols=['#FFD0DE','#FFF0B3','#C9F2E4','#E6DAFF','#CFEBFF'];
      for(let k=0;k<4;k++){ const cx=x0+42+k*72, c=cols[(k+row*2+(x0>500?1:0))%5];
        if((k+row)%3===0) g+=`<path d="M${cx-24} ${y} L${cx-20} ${y-30} H${cx+20} L${cx+24} ${y}Z" fill="${c}"/><path d="M${cx-26} ${y-30} Q${cx-26} ${y-60} ${cx} ${y-62} Q${cx+26} ${y-60} ${cx+26} ${y-30}Z" fill="#FFF7EC"/><circle cx="${cx}" cy="${y-66}" r="7" fill="#FFB3C6"/>`;

    return `<g opacity=".7">${g}</g>`; };
  s+=shelf(40)+shelf(1026);
  s+=`<g>`; for(let x=0,k=0;x<1366;x+=100,k++) s+=`<rect x="${x}" y="0" width="100" height="112" fill="${k%2?'#FFF8EF':'#FFC9D8'}"/>`;

  s+=`<rect x="0" y="930" width="1366" height="94" fill="#FDE6D8"/></svg>`;

/* ---------- ROUND BUILDING ---------- */
function activeVowels(){
  const en=VOWELS.filter(v=>S.settings.vowels[v]);
  return en.length>=2 ? en : VOWELS.slice();
}
function choiceSet(v, V){
  const n = Math.floor(rand(CHOICES_MIN, Math.min(CHOICES_MAX, V.length)+1));
  const others = shuffle(V.filter(x=>x!==v)).slice(0, n-1);
  return [v, ...others].sort((a,b)=>VOWELS.indexOf(a)-VOWELS.indexOf(b));
}
function enabledModes(){ const m=S.settings.modes; return (!m.picture && !m.morph) ? {picture:true} : {picture:!!m.picture, morph:!!m.morph}; }
function missRate(v){ const r=S.stats.recent[v]||[]; if(r.length<3) return .25; return r.filter(x=>!x).length/r.length; }
function frameWord(frame,v){ return frame.replace('_',v); }
function morphInfo(fr,V){
  const opts=V.filter(v=>!fr.skip.includes(frameWord(fr.frame,v)));
  const reals=opts.filter(v=>fr.real.includes(frameWord(fr.frame,v))), sillies=opts.filter(v=>!fr.real.includes(frameWord(fr.frame,v)));
  return {opts,reals,sillies, ok: reals.length>=2 && sillies.length>=1};
}
function pickFrame(V,usedFrames=[]){
  const ok=MORPH_FRAMES.filter(fr=>!usedFrames.includes(fr.frame) && morphInfo(fr,V).ok);
  return ok.length ? pick(ok) : null;
}
function makeMorphItem(V,used){
  const fr=pickFrame(V,used); if(!fr) return null;
  const info=morphInfo(fr,V);
  return {mode:'morph', frame:fr.frame, start:pick(info.reals), swaps: Math.random()<.5?4:5, w:2};
}
function buildRound(){
  const V=activeVowels(), M=enabledModes(), used=new Set(), items=[];
  let slots=ITEMS_PER_ROUND; const morphs=[];
  if(M.morph && V.length>=3){
    const want = !M.picture ? 5 : 1; const usedFr=[];
    for(let k=0;k<want;k++){ const it=makeMorphItem(V,usedFr); if(!it) break; usedFr.push(it.frame); morphs.push(it); slots-=2; }
  }
  // Everything that isn't a Monster Morph chain is a Picture Puzzle.
  const left = v=>PICTURE_WORDS[v].filter(w=>!used.has(w));
  const vplan=[]; shuffle(V).forEach(v=>{ if(vplan.length<slots) vplan.push(v); });
  while(vplan.length<slots) vplan.push(weightedPick(V, v=>1+4*missRate(v)));
  vplan.forEach(v=>{
    if(!left(v).length){ const alt=V.filter(x=>left(x).length); if(!alt.length) return; v=pick(alt); }
    const word = weightedPick(left(v), w=>1+Math.min(3,(S.stats.missed[w]||0)));
    used.add(word); items.push({mode:'picture', word, vowel:v, choices:choiceSet(v,V), w:1});
  });
  const out = shuffle(items);
  morphs.forEach((m,k)=>{ m.vs=V.slice(); out.splice(Math.min(out.length, 3+k*2), 0, m); });
  return {items:out, idx:0, results:[], first:{}, ms:null};
}

/* ---------- PLAY ---------- */
let R=null, V=[];
function startRound(){
  if(!S.round || !S.round.items || S.round.items.some(i=>i.mode==='snack' || (i.mode==='picture' && !i.choices))) S.round = buildRound();
  R=S.round; save();
  const el=$('#play');
  el.innerHTML=`<div class="topbar"><button class="btn-round" id="btn-home" aria-label="home">${ICON.house}</button><div class="progress" id="progress"></div><div class="spacer"></div></div>
    <div class="stage" id="stage"></div><div class="counter" id="lineup"></div>`;
  onTap($('#btn-home'), ()=>{ SND.pop(); save(); goHome(); });
  show('play');
  renderItem();
}
function renderProgress(){
  const done=R.results.reduce((a,r)=>a+r.w,0);
  $('#progress').innerHTML = Array.from({length:ITEMS_PER_ROUND},(_,k)=>`<div class="pdot ${k<done?'f':''}"></div>`).join('');
}
function buildLineup(vs){
  const L=$('#lineup'); L.innerHTML=''; const map={};
  vs.forEach(v=>{ const s=makeSlot(v); L.appendChild(s); map[v]=s; });
  $$('.mirror-btn',L).forEach(b=>onTap(b, e=>{ e.stopPropagation(); toggleMirror(b.closest('.slot')); }));
  return map;
}
function renderItem(){
  closeMirror(); renderProgress();
  const item=R.items[R.idx]; if(!item){ finishRound(); return; }
  V = (item.choices || item.vs || activeVowels()).slice().sort((a,b)=>VOWELS.indexOf(a)-VOWELS.indexOf(b));
  if(item.vowel && !V.includes(item.vowel)) { V.push(item.vowel); V.sort((a,b)=>VOWELS.indexOf(a)-VOWELS.indexOf(b)); }
  const tok=playToken;

}
function wordHTML(word,{gap=false,color=null}={}){
  return word.split('').map((ch,k)=>{
    if(k===1 && gap) return `<span class="gap" id="gap"></span>`;
    return `<span class="L ${k===1?'vs':''}" ${k===1&&color?`style="color:${color}"`:''}>${ch}</span>`;
  }).join('');
}
function recordFirst(item, picked, correct){
  if(R.first[R.idx]) return;
  R.first[R.idx]={picked,correct};
  const v=item.vowel, st=S.stats;
  st.vowel[v].n++; if(correct) st.vowel[v].c++;
  st.recent[v].push(correct); if(st.recent[v].length>15) st.recent[v].shift();
  if(!correct){ const k=v+'>'+picked; st.conf[k]=(st.conf[k]||0)+1; st.missed[item.word]=(st.missed[item.word]||0)+1; }
  save();
}
async function itemDone(result, tok){
  keyHandler=null; TEST.auto=TEST.wrong=null;
  R.results.push(result); R.idx++; R.ms=null; save(); renderProgress();
  await wait(250); if(tok!==playToken) return;
  if(R.idx>=R.items.length) finishRound(); else renderItem();
}
function clearHints(){ $$('#lineup .slot').forEach(s=>s.classList.remove('coach','cam','selected')); closeMirror(); }
function showHint(v){
  const slot=$(`#lineup .slot[data-v="${v}"]`); if(!slot) return;
  slot.classList.add('coach'); if(mirrorAvailable()) slot.classList.add('cam');
}
function puzzled(slot){

  clearTimeout(slot._pz); slot._pz=setTimeout(()=>slot.classList.remove('puzzled'),1500);
}
function mouthPoint(slot){
  const svg=$('svg',slot), r=svg.getBoundingClientRect(), [mx,my]=FACE[slot.dataset.v].mouth;
  return [r.left+mx/200*r.width, r.top+(my+12)/232*r.height];
}

/* ---- Picture Puzzle ---- */
function renderPicture(item,tok){
  const st=$('#stage');

      Object.values(slots).forEach(s=>{ if(s!==slot) react($('.mon',s),'r-hop',600); });
      await wait(1300); if(tok!==playToken) return;
      itemDone({mode:'picture',w:1,c:R.first[R.idx].correct?1:0,word:item.word},tok);
    } else {

/* ---- Mode 3: Monster Morph ---- */
const CAUL_BACK=`<svg viewBox="0 0 300 250"><ellipse cx="150" cy="92" rx="132" ry="26" fill="#6E5DA6" stroke="#4B3C80" stroke-width="5"/><ellipse cx="150" cy="94" rx="116" ry="18" fill="#9DF0C8"/><ellipse cx="120" cy="90" rx="30" ry="6" fill="#C8FFE4"/></svg>`;
const CAUL_FRONT=`<svg class="front" viewBox="0 0 300 250"><path d="M18 92 A132 26 0 0 0 282 92 Q292 226 150 240 Q8 226 18 92Z" fill="#8E7CC3" stroke="#4B3C80" stroke-width="5" stroke-linejoin="round"/><path d="M40 130 Q42 190 90 214" stroke="#B5A7E2" stroke-width="9" fill="none" stroke-linecap="round" opacity=".8"/><circle cx="126" cy="170" r="7" fill="#3A2A4A"/><circle cx="174" cy="170" r="7" fill="#3A2A4A"/><circle cx="124" cy="167" r="2.5" fill="#fff"/><circle cx="172" cy="167" r="2.5" fill="#fff"/><path d="M138 186 Q150 196 162 186" stroke="#3A2A4A" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="108" cy="186" rx="10" ry="6" fill="#FFB3CC" opacity=".8"/><ellipse cx="192" cy="186" rx="10" ry="6" fill="#FFB3CC" opacity=".8"/><ellipse cx="96" cy="242" rx="18" ry="8" fill="#6E5DA6" stroke="#4B3C80" stroke-width="4"/><ellipse cx="204" cy="242" rx="18" ry="8" fill="#6E5DA6" stroke="#4B3C80" stroke-width="4"/></svg>`;
function renderMorph(item,tok){
  const fr=MORPH_FRAMES.find(f=>f.frame===item.frame);
  if(!R.ms) R.ms={cur:item.start, done:0, correct:0, got:{real:false,silly:false}, phase:'swap', first:false};
  const ms=R.ms; save();
  const st=$('#stage');
  st.innerHTML=`<div><div class="chain" id="chain"></div><div class="morph-wrap"><div class="caul" id="caul">${CAUL_BACK}<div class="cw"><div class="word" id="cword"></div></div>${CAUL_FRONT}
    ${[18,38,58,76].map((l,k)=>`<i class="cbub" style="left:${l}%;width:${14+k*3}px;height:${14+k*3}px;animation-delay:${k*.6}s"></i>`).join('')}</div>
    <div class="judge-box" id="judge"><button class="judge" data-j="real" aria-label="real word">👍<span class="keyhint">1</span></button><button class="judge" data-j="silly" aria-label="silly word">🤪<span class="keyhint">2</span></button></div></div></div>`;
  const slots=buildLineup(V), caul=$('#caul'); let sel=null, busy=false;
  const word=()=>frameWord(item.frame, ms.cur);
  const isReal=w=>fr.real.includes(w);
  function drawWord(pop){ $('#cword').innerHTML=wordHTML(word(),{color:MON[ms.cur].o}); if(pop){ const L=$('#cword .vs'); L.animate([{transform:'scale(0) rotate(-30deg)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:500,easing:'ease-out'}); } }
  function drawChain(){ $('#chain').innerHTML=Array.from({length:item.swaps},(_,k)=>`<i class="${k<ms.done?'f':''}"></i>`).join(''); }
  function allowed(v){
    if(v===ms.cur) return false;
    const w=frameWord(item.frame,v); if(fr.skip.includes(w)) return false;
    if(ms.done===item.swaps-1){ const need = !ms.got.real ? 'real' : !ms.got.silly ? 'silly' : null;
      if(need){ const cand=V.filter(x=>x!==ms.cur && !fr.skip.includes(frameWord(item.frame,x)) && (isReal(frameWord(item.frame,x))===(need==='real')));
        if(cand.length) return cand.includes(v); } }
    return true;
  }
  function refreshSlots(){
    Object.values(slots).forEach(s=>{ const v=s.dataset.v, w=frameWord(item.frame,v);
      s.classList.toggle('asleep', fr.skip.includes(w));
      s.classList.toggle('dim', !fr.skip.includes(w) && (ms.phase!=='swap' || !allowed(v))); });
  }
  function setPhase(p){ ms.phase=p; $('#judge').classList.toggle('on', p==='judge'); refreshSlots(); save(); updateTestPanel(); }
  drawWord(false); drawChain(); setPhase(ms.phase);
  Object.values(slots).forEach(s=>{ const mon=$('.mon',s), v=s.dataset.v;
    dragify(mon,{ targets:()=>[caul], canStart:()=>!busy && ms.phase==='swap' && allowed(v),
      onBlocked:()=>{ if(ms.phase==='judge'){ const j=$('#judge'); j.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:400}); } },
      onStart:()=>{ sel=null; $$('#lineup .slot').forEach(x=>x.classList.remove('selected')); },
      onTap:()=>{ sel = sel===v?null:v; $$('#lineup .slot').forEach(x=>x.classList.toggle('selected',x.dataset.v===sel)); SND.pop(); },
      onDrop:()=>swap(v) }); });
  onTap(caul, ()=>{ if(sel && ms.phase==='swap' && !busy) swap(sel); });
  $$('.judge').forEach(b=>onTap(b, ()=>judge(b.dataset.j)));
  keyHandler = k=>{
    if(V.includes(k)){ if(ms.phase==='swap'){ if(allowed(k)) swap(k); else react($('.mon',slots[k]),'r-wiggle',800); } else onBlockedJudge(); return true; }
    if(['1','r','arrowleft'].includes(k)){ judge('real'); return true; }
    if(['2','s','arrowright'].includes(k)){ judge('silly'); return true; }
  };
  function onBlockedJudge(){ $('#judge').animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:400}); }
  TEST.auto = ()=>{ if(ms.phase==='swap'){ const v=V.find(allowed); if(v) swap(v); } else judge(isReal(word())?'real':'silly'); };
  TEST.wrong = ()=>{ if(ms.phase==='swap'){ const v=V.find(allowed); if(v) swap(v); } else judge(isReal(word())?'silly':'real'); };
  async function swap(v){
    if(busy || !allowed(v)) return; busy=true; sel=null; $$('#lineup .slot').forEach(x=>x.classList.remove('selected'));
    const slot=slots[v], mon=$('.mon',slot); slot.classList.add('top');
    const [cx,cy]=centerOf($('.cw',caul)); SND.boing();
    await flyTo(mon,cx,cy,.3,420); if(tok!==playToken) return;
    mon.style.opacity='0'; SND.splash(); burst(cx,cy,MON[v].c,14);

  }
  async function judge(j){
    if(busy || ms.phase!=='judge') return; busy=true;
    const w=word(), real=isReal(w), correct=(j==='real')===real;
    if(!ms.first){ ms.first=true; S.stats.morph.n++; if(correct){ S.stats.morph.c++; ms.correct++; } else S.stats.missed[w+(real?' (real)':' (silly)')]=(S.stats.missed[w+(real?' (real)':' (silly)')]||0)+1; save(); }
    $$('.judge').forEach(b=>b.classList.remove('hintglow'));
    if(correct){
      $('#judge').classList.remove('on');
      $$('#cword .glow').forEach(x=>x.classList.remove('glow'));
      if(real){ SND.sparkle(); Object.values(slots).forEach(s=>react($('.mon',s),'r-hop',600)); const [x,y]=centerOf(caul); burst(x,y-60,'#9DF0C8',16);
        if(PICTURES[w]) caul.insertAdjacentHTML('beforeend',`<div class="morph-pic">${pictureHTML(w)}</div>`); }
      else { SND.giggle(); Object.values(slots).forEach(s=>react($('.mon',s),'r-giggle',900)); }
      ms.got[real?'real':'silly']=true; ms.done++; drawChain(); save();
      await wait(1500); if(tok!==playToken) return;
      $$('.morph-pic',caul).forEach(x=>x.remove());
      if(ms.done>=item.swaps){ itemDone({mode:'morph',w:2,c:2*ms.correct/item.swaps,word:item.frame},tok); return; }
      setPhase('swap'); busy=false;
    } else {
      SND.hmm(); Object.values(slots).forEach(s=>{ if(!s.classList.contains('asleep')) react($('.mon',s),'r-tilt',1500); });
      $(`.judge[data-j="${real?'real':'silly'}"]`).classList.add('hintglow');
      $('#cword .vs').classList.add('glow');
      if(real && PICTURES[w] && !$('.morph-pic',caul)) caul.insertAdjacentHTML('beforeend',`<div class="morph-pic">${pictureHTML(w)}</div>`);
      await wait(500); busy=false;
    }
  }
}

let camStream=null, camDenied=false;
function mirrorAvailable(){ return !camDenied && window.isSecureContext && navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia==='function'; }
async function toggleMirror(slot){

/* =====================================================================
   AI / AY WORD BUILDER
   Tap 🔊 to hear the word, then drag: start (letter or blend) → ai or ay → end.
   The end column always offers 🛑 ("the word stops here") so the slots
   never give away ai vs ay.
   ===================================================================== */
let AR=null;
const STOP='-';   // value of the 🛑 tile
function buildAiRound(){
  const all=AIAY_WORDS.map(parseAi), st=S.ai.stats;
  const nAi=Math.floor(rand(4,7)), want={ai:nAi, ay:ITEMS_PER_ROUND-nAi}, used=new Set(), items=[];
  for(const team of ['ai','ay']){
    for(let k=0;k<want[team];k++){
      const pool=all.filter(x=>x.team===team && !used.has(x.w)); if(!pool.length) break;
      const it=weightedPick(pool, x=>(AIAY_PICTURES[x.w]?3:1)*(1+Math.min(3,(st.missed[x.w]||0)))); used.add(it.w); items.push(it);
    }
  }
  return {items:shuffle(items), idx:0, results:[], first:{}};
}
function startAiRound(){
  if(!S.ai.round || !S.ai.round.items || !S.ai.round.items.length) S.ai.round=buildAiRound();
  AR=S.ai.round; save();
  const el=$('#ai');
  el.innerHTML=`<div class="topbar"><button class="btn-round" id="ai-home" aria-label="home">${ICON.house}</button><div class="progress" id="ai-progress"></div><div class="spacer"></div></div>
    <div class="stage" id="ai-stage"></div>`;
  onTap($('#ai-home'), ()=>{ SND.pop(); try{ speechSynthesis.cancel(); }catch(e){} save(); goHome(); });
  show('ai');
  renderAiItem(true);
}
function renderAiProgress(){
  const done=AR.results.length;
  $('#ai-progress').innerHTML=Array.from({length:ITEMS_PER_ROUND},(_,k)=>`<div class="pdot ${k<done?'f':''}"></div>`).join('');
}
function aiChoices(it){
  const ons=[...new Set(AIAY_WORDS.map(x=>x.split('|')[0]))].filter(o=>o!==it.on);
  const end = it.end ? it.end : STOP;
  const endOpts=[end, ...(end===STOP?[]:[STOP])];
  shuffle(AIAY_END_LETTERS.filter(l=>l!==it.end)).forEach(l=>{ if(endOpts.length<3) endOpts.push(l); });
  return [ shuffle([it.on, ...shuffle(ons).slice(0,2)]), shuffle(['ai','ay']), shuffle(endOpts) ];
}
const tileLabel = v=> v===STOP ? '<span class="stopsign">🛑</span>' : v;
function renderAiItem(firstInGesture){
  renderAiProgress();
  const it=AR.items[AR.idx]; if(!it){ finishAiRound(); return; }
  const tok=playToken, ans=[it.on, it.team, it.end||STOP], cols=aiChoices(it);
  const canSpeak=SPEAK.ok();
  const st=$('#ai-stage');
  const pic=AIAY_PICTURES[it.w];

    if(busy || filled[c]) return; busy=true;

    }

  }

    const allRight=[0,1,2].every(c=>firstCol[c]===true), s=S.ai.stats;

    SPEAK.say(it.w);

  }
}
function finishAiRound(){
  const tot=AR.results.length, cor=AR.results.reduce((a,r)=>a+r.c,0);
  S.ai.stats.rounds.unshift({t:Date.now(), game:'aiay', acc:tot?Math.round(100*cor/tot):0, cor, tot});

/* ---------- ROUND END & REWARDS ---------- */
function makeSticker(){
  const emo=['🍩','🌈','⭐','🧁','🍓','🎈','🍭','🦄','🌸','🍦','🎉','🐝','🍉','🌟','🦋','🍪'];
  const unlocked=ACC_ORDER.slice(0,Math.floor(S.stickers.length/3));
  if(Math.random()<.5) return {k:'m', v:pick(ALLMON), acc: unlocked.length && Math.random()<.6 ? pick(unlocked) : null, rot:Math.round(rand(-14,14))};
  return {k:'e', e:pick(emo), rot:Math.round(rand(-14,14))};
}
function awardSticker(){
  const st=makeSticker(); S.stickers.push(st);
  const n=S.stickers.length, unlock=(n%3===0 && n/3<=ACC_ORDER.length) ? ACC_ORDER[n/3-1] : null;
  return {st, unlock};
}
function stickerHTML(st,cls=''){
  let inner = st.k==='m' ? monsterSVG(st.v,{dress: st.acc ? {[ACC[st.acc].slot]:st.acc} : {}, delay:0}) : st.e;
  return `<div class="sticker ${cls}" style="--rot:${st.rot}deg">${inner}</div>`;
}
function finishRound(){
  const res=R.results; let tot=0, cor=0; res.forEach(r=>{ tot+=r.w; cor+=r.c; });
  const acc = tot ? cor/tot : 0;
  S.stats.rounds.unshift({t:Date.now(), game:'short', acc:Math.round(acc*100), cor:Math.round(cor*10)/10, tot});
  S.stats.rounds = S.stats.rounds.slice(0,40);
  const {st, unlock}=awardSticker();
  S.round=null; R=null; save(); keyHandler=null; TEST.auto=TEST.wrong=null;
  showRewards(st, unlock, startRound); updateTestPanel();
}

  const stop=()=>{ clearTimeout(timer); g.classList.remove('pressing'); };

}

  const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  return n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?'-'+ones[n%10]:'');
}

  const afterRestore=err=>{ if(err){ msg(err); return; } O.classList.remove('on'); O.innerHTML=''; goHome(); };
  onTap($('#p-do-restore'), ()=>{ const t=$('#p-code').value; if(!t.trim()){ msg('Paste a backup code first.'); return; } if(confirm('Replace the progress on this device with this backup?')) afterRestore(restoreFrom(t)); });
  $('#p-filein').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ if(confirm('Replace the progress on this device with this backup?')) afterRestore(restoreFrom(rd.result)); }; rd.readAsText(f); });
  onTap($('#p-done'), ()=>{ O.classList.remove('on'); O.innerHTML=''; if($('#home').classList.contains('on')) renderHome(); });
  $$('[data-rate]',O).forEach(b=>onTap(b,()=>{ set.speechRate=+b.dataset.rate; save(); SPEAK.say('rain'); re(); }));
  $$('[data-voice]',O).forEach(b=>onTap(b,()=>{ const v=voices[+b.dataset.voice]; if(!v) return; set.voice=v.name; save(); SPEAK.pick(); SPEAK.say('rain, play'); re(); }));
  onTap($('#p-voice'),()=>{ SPEAK.pick(); SPEAK.say('chain, mail, say, way'); });
  $$('[data-vowel]',O).forEach(b=>onTap(b,()=>{ const v=b.dataset.vowel; set.vowels[v]=!set.vowels[v]; S.round=null; save(); re(); }));
  $$('[data-mode]',O).forEach(b=>onTap(b,()=>{ const k=b.dataset.mode; set.modes[k]=!set.modes[k]; if(!set.modes.picture&&!set.modes.morph) set.modes.picture=true; S.round=null; save(); re(); }));
  onTap($('#p-sound'),()=>{ set.sound=!set.sound; save(); re(); });
  onTap($('#p-test'),()=>{ O.classList.remove('on'); O.innerHTML=''; toggleTestPanel(true); });
  onTap($('#p-gallery'),()=>{ openGallery(); });
  const rb=$('#p-reset'); let armed=false;
  onTap(rb,()=>{ if(!armed){ armed=true; rb.classList.add('armed'); rb.textContent='Tap again to erase everything'; setTimeout(()=>{ armed=false; if(rb.isConnected){ rb.classList.remove('armed'); rb.textContent='Reset all progress'; } },3500); return; }
    const keep=S.settings; S=freshState(); S.settings=keep; R=null; AR=null; save(); O.classList.remove('on'); O.innerHTML=''; goHome(); });
}

/* =====================================================================
   VALIDATION (used by tests; run __mv.validate() in the console)
   ===================================================================== */
function validateWords(){
  const errs=[], re=/^[bcdfghjklmnpqrstvwxyz][aeiou][bcdfghjklmnpqrstvwxyz]$/;
  const check=(w,v,src)=>{
    if(!re.test(w)){ errs.push(`${src}: "${w}" is not a CVC word`); return; }
    if(w[1]!==v) errs.push(`${src}: "${w}" is tagged "${v}"`);
    if((w[2]==='x'||w[2]==='w') && !ALLOWED_X_W_ENDINGS.includes(w)) errs.push(`${src}: "${w}" ends in x/w`);
    if('rly'.includes(w[2])) errs.push(`${src}: "${w}" ends in r/l/y`);
    if(w[0]==='c' && 'ei'.includes(w[1])) errs.push(`${src}: "${w}" has a soft c`);
    if(EXCLUDED_WORDS.includes(w)) errs.push(`${src}: "${w}" is excluded`);
  };
  const all={};
  for(const v of VOWELS){
    if(PICTURE_WORDS[v].length<6) errs.push(`picture ${v}: only ${PICTURE_WORDS[v].length} words (want 6+)`);
    PICTURE_WORDS[v].forEach(w=>{ if(all[w]) errs.push(`"${w}" listed twice`); all[w]=1; });
    PICTURE_WORDS[v].forEach(w=>{ check(w,v,'picture '+v); if(!PICTURES[w]) errs.push(`picture ${v}: "${w}" has no picture`); else if(PICTURES[w].startsWith('svg:') && !ICONS_SVG[PICTURES[w].slice(4)]) errs.push(`"${w}" svg icon missing`); });
    if(new Set(PICTURE_WORDS[v]).size!==PICTURE_WORDS[v].length) errs.push(`picture ${v} has duplicates`);
  }
  MORPH_FRAMES.forEach(fr=>{
    if(!/^[a-z]_[a-z]$/.test(fr.frame)) errs.push(`bad frame ${fr.frame}`);
    [...fr.real,...fr.skip].forEach(w=>{ if(w[0]!==fr.frame[0]||w[2]!==fr.frame[2]) errs.push(`${fr.frame}: "${w}" doesn't fit`); });
    fr.real.forEach(w=>check(w,w[1],'morph '+fr.frame));
    VOWELS.forEach(v=>{ const w=frameWord(fr.frame,v); if(EXCLUDED_WORDS.includes(w) && !fr.skip.includes(w)) errs.push(`${fr.frame}: excluded "${w}" is not skipped`); if(fr.real.includes(w)&&fr.skip.includes(w)) errs.push(`${fr.frame}: "${w}" both real and skip`); });
  });
  const seenAi={};
  AIAY_WORDS.forEach(s=>{
    const parts=s.split('|'); if(parts.length!==3){ errs.push(`ai/ay "${s}" needs start|team|end`); return; }
    const {w,on,team,end}=parseAi(s);
    if(!/^[a-z]{1,3}$/.test(on)) errs.push(`ai/ay "${w}": bad start "${on}"`);
    if(team!=='ai' && team!=='ay') errs.push(`ai/ay "${w}": team must be ai or ay`);
    if(team==='ai' && !AIAY_END_LETTERS.includes(end)) errs.push(`ai/ay "${w}": ai words need a last letter from ${AIAY_END_LETTERS.join(',')}`);
    if(team==='ay' && end!=='') errs.push(`ai/ay "${w}": ay words end with ay`);
    if(seenAi[w]) errs.push(`ai/ay "${w}" listed twice`); seenAi[w]=1;
  });
  Object.keys(AIAY_PICTURES).forEach(w=>{ if(!seenAi[w]) errs.push(`ai/ay picture for unknown word "${w}"`); });
  const nai=AIAY_WORDS.filter(s=>s.includes('|ai|')).length, nay=AIAY_WORDS.length-nai;
  if(nai<6||nay<6) errs.push('ai/ay needs 6+ words of each team');
  return {ok:!errs.length, errs, counts:{...Object.fromEntries(VOWELS.map(v=>[v,PICTURE_WORDS[v].length])), ai:nai, ay:nay}};
}
function morphTable(){
  return MORPH_FRAMES.map(fr=>{ const row={frame:fr.frame};
    VOWELS.forEach(v=>{ const w=frameWord(fr.frame,v); row[v]= fr.skip.includes(w)?`${w}: skip`: fr.real.includes(w)?`${w}: REAL`:`${w}: silly`; });
    row.usable = morphInfo(fr,VOWELS).ok ? 'yes' : 'never (no silly word)';
    return row; });
}

/* =====================================================================
   COMPUTER: keyboard + grown-up TEST PANEL  (Shift+T, or open the file with ?test at the end)
   ===================================================================== */
function onKey(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key.toLowerCase();
  if(e.shiftKey && k==='t'){ e.preventDefault(); toggleTestPanel(); return; }
  if(e.target.closest && e.target.closest('#testpanel')) return;
  SND.init();
  const O=$('#overlay');
  if(k==='escape'){
    e.preventDefault();
    if(O.classList.contains('on') && (O.querySelector('.panel') || O.querySelector('.gate'))){ O.classList.remove('on'); O.innerHTML=''; if($('#home').classList.contains('on')) goHome(); return; }
    if($('#gallery').classList.contains('on')){ closeGallery(); return; }
    if(!$('#home').classList.contains('on') || O.classList.contains('on')){ save(); goHome(); }
    return;
  }
  if(O.classList.contains('on') && !$('#rw-play')) return;   // reward animation, gate or parent panel
  if(keyHandler && !e.repeat && keyHandler(k,e)) e.preventDefault();
}
function toggleTestPanel(force){
  TEST.on = force===undefined ? !TEST.on : force;
  const p=$('#testpanel'); p.classList.toggle('on',TEST.on);
  if(TEST.on && !p.innerHTML){
    p.innerHTML=`<div class="hd"><span>🧪 Test panel</span><span><button data-act="min" title="minimize">–</button> <button data-act="close" title="close (Shift+T)">✕</button></span></div>
    <div class="body"><div class="info" id="tp-info"></div>
    <div class="lbl">Current item</div><div class="row"><button data-act="auto">✓ Answer right</button><button data-act="wrong">✗ Answer wrong</button><button data-act="skip">Skip ⏭</button></div>
    <div class="lbl">Jump to</div><div class="row"><button data-act="picture">Vowel picture</button><button data-act="morph">Monster Morph</button><button data-act="aiay">ai/ay word</button></div>
    <div class="lbl">Round</div><div class="row"><button data-act="finish">Finish round (all right)</button><button data-act="finishbad">Finish round (all wrong)</button><button data-act="stickers">+3 stickers</button></div>
    <div class="lbl">Other</div><div class="row"><button data-act="home">Home</button><button data-act="parent">Grown-up corner</button><button data-act="gallery">Monster gallery</button><button data-act="mirror">Mirror</button><button data-act="sound">Sound on/off</button><button data-act="reset">Reset progress</button></div>
    <div class="keys"><b>Keyboard:</b> <kbd>a</kbd><kbd>e</kbd><kbd>i</kbd><kbd>o</kbd><kbd>u</kbd> drop that monster in · <kbd>1</kbd>/<kbd>←</kbd> real 👍 · <kbd>2</kbd>/<kbd>→</kbd> silly 🤪 · <kbd>Space</kbd> say word (ai/ay) · <kbd>1</kbd>/<kbd>2</kbd> pick a game on the start screen · <kbd>Esc</kbd> start screen · <kbd>Shift+T</kbd> this panel</div></div>`;
    p.addEventListener('click', e=>{ const b=e.target.closest('button[data-act]'); if(b) testAct(b.dataset.act); });
  }
  updateTestPanel();
}
function updateTestPanel(){
  if(!TEST.on) return; const el=$('#tp-info'); if(!el) return;
  const scr=($('.screen.on')||{}).id||'—';
  let s=`Vowels on: ${activeVowels().join(' ')}\nScreen: ${scr}  ·  Stickers: ${S.stickers.length}`;
  if(AR && scr==='ai'){ const it=AR.items[AR.idx]; if(it) s+=`\nai/ay word ${AR.idx+1}/${AR.items.length}  ·  score ${AR.results.reduce((a,r)=>a+r.c,0)}/${AR.results.length}\nWord: ${it.w}  →  <span class="ans">${it.on} + ${it.team} + ${it.end||'🛑'}</span>`; }
  if(R && scr==='play'){
    const it=R.items[R.idx];
    const done=R.results.reduce((a,r)=>a+r.w,0), got=R.results.reduce((a,r)=>a+r.c,0);
    s+=`\nItem ${R.idx+1}/${R.items.length}  ·  score ${Math.round(got*10)/10}/${done}`;
    if(it){
      if(it.mode==='morph'){ const fr=MORPH_FRAMES.find(f=>f.frame===it.frame), ms=R.ms; const w=ms?frameWord(it.frame,ms.cur):'';
        s+=`\nMode: Monster Morph  ${it.frame}\nWord: ${w}  →  <span class="ans">${fr&&fr.real.includes(w)?'REAL 👍':'silly 🤪'}</span>\nSwaps: ${ms?ms.done:0}/${it.swaps}  ·  phase: ${ms?ms.phase:''}`; }
      else s+=`\nMode: Picture Puzzle (${(it.choices||[]).length} choices)\nWord: ${it.word}  →  answer <span class="ans">${it.vowel}</span>${R.first[R.idx]?`\nFirst try: ${R.first[R.idx].correct?'right':'wrong ('+R.first[R.idx].picked+')'}`:''}`;
    }
  }
  el.innerHTML=s;
}
function testAct(a){
  const playing=$('#play').classList.contains('on') && R, aiPlaying=$('#ai').classList.contains('on') && AR;
  if(a==='aiay'){ if(!aiPlaying){ S.lastGame='aiay'; startAiRound(); } else { playToken++; renderAiItem(false); } return; }
  if(aiPlaying && (a==='skip'||a==='finish'||a==='finishbad')){
    playToken++;
    if(a==='skip'){ AR.results.push({w:AR.items[AR.idx].w,c:1}); AR.idx++; save(); if(AR.idx>=AR.items.length) finishAiRound(); else renderAiItem(false); return; }
    while(AR.idx<AR.items.length){ AR.results.push({w:AR.items[AR.idx].w,c:a==='finish'?1:0}); AR.idx++; }
    finishAiRound(); return;
  }
  if(a==='close') return toggleTestPanel(false);
  if(a==='min') return $('#testpanel').classList.toggle('min');
  if(a==='auto'){ if(TEST.auto) TEST.auto(); return; }
  if(a==='wrong'){ if(TEST.wrong) TEST.wrong(); return; }
  if(a==='picture'||a==='morph'){
    if(!playing) startRound();
    const AV=activeVowels(); let item;
    if(a==='morph'){ const VV = AV.length>=3 ? AV : VOWELS.slice(); item=makeMorphItem(VV,[]); item.vs=VV; }
    else { const v=pick(AV); item={mode:'picture', word:pick(PICTURE_WORDS[v]), vowel:v, choices:choiceSet(v,AV), w:1}; }
    R.items[R.idx]=item; R.ms=null; delete R.first[R.idx]; save(); playToken++; renderItem(); return;
  }
  if(a==='skip'){ if(!playing) return; const it=R.items[R.idx]; playToken++; itemDone({mode:it.mode,w:it.w,c:it.w,word:it.word||it.frame},playToken); return; }
  if(a==='finish'||a==='finishbad'){ if(!playing) startRound(); playToken++;
    for(let i=R.idx;i<R.items.length;i++){ const it=R.items[i]; R.results.push({mode:it.mode,w:it.w,c:a==='finish'?it.w:0,word:it.word||it.frame}); }
    R.idx=R.items.length; finishRound(); return; }
  if(a==='stickers'){ for(let k=0;k<3;k++) S.stickers.push(makeSticker()); save(); if($('#home').classList.contains('on')) goHome(); else if($('#book').classList.contains('on')) openBook(); else if($('#dress').classList.contains('on')) renderDress(); updateTestPanel(); return; }
  if(a==='home'){ save(); goHome(); return; }
  if(a==='parent'){ openParent(); return; }
  if(a==='gallery'){ openGallery(); return; }
  if(a==='mirror'){ const s=$('#lineup .slot'); if(playing && s){ if(!mirrorAvailable()) alert('The camera mirror needs HTTPS (or localhost) and camera permission.'); else toggleMirror(s); } else alert('Start a round first.'); return; }
  if(a==='sound'){ S.settings.sound=!S.settings.sound; save(); SND.init(); SND.pop(); return; }
  if(a==='reset'){ if(confirm('Erase all progress, stickers and stats?')){ const keep=S.settings; S=freshState(); S.settings=keep; R=null; AR=null; save(); goHome(); } return; }
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot(){
  load(); installDefs(); buildScene(); renderPortrait(); onTap($('#mirror'), closeMirror);
  document.addEventListener('touchmove', e=>{ if(!e.target.closest('.scroll, #gallery')) e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturestart', e=>e.preventDefault());
  document.addEventListener('dblclick', e=>e.preventDefault());
  document.addEventListener('contextmenu', e=>{ if(!e.target.closest('textarea,input')) e.preventDefault(); });
  document.addEventListener('pointerdown', ()=>SND.init(), true);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ closeMirror(); save(); } });
  window.addEventListener('pagehide', ()=>save());
  askPersist(); document.addEventListener('pointerdown', ()=>{ if(storagePersisted!==true) askPersist(); }, {once:true});
  document.addEventListener('keydown', onKey);
  if(SPEAK.ok()){ SPEAK.pick(); try{ speechSynthesis.addEventListener('voiceschanged', ()=>SPEAK.pick()); }catch(e){} }
  if(location.hash==='#gallery') openGallery(); else goHome();
  if(/[?&]test\b/.test(location.search) || location.hash==='#test') toggleTestPanel(true);
}
window.__mv = { get S(){return S;}, get R(){return R;}, validate:validateWords, morphTable, buildRound, activeVowels, MORPH_FRAMES, PICTURE_WORDS };
boot();
